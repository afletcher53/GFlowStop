[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amortized-bayesian-stopping"
version = "0.1.0"
description = "Cost-sensitive Bayesian finite-horizon stopping with policy distillation"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "python-terrier>=1.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
# learned stopping flow networks and the CLEF scripts (which also need pyterrier-tar)
flow = ["torch>=2.1", "matplotlib>=3.6"]

[project.scripts]
amortized-stopping = "gflowstop.experiment:main"
amortized-stopping-toys = "gflowstop.toy_experiment:main"
amortized-stopping-repke = "gflowstop.external_benchmark:main"
amortized-stopping-horizon = "gflowstop.external_horizon:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
